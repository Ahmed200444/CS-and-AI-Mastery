name: Source Handoff
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Package source for deployment handoff
        uses: actions/upload-artifact@v4
        with:
          name: csai-source-handoff
          path: |
            .
            !.git/**
            !node_modules/**
            !netlify-mcp-runtime/**
          retention-days: 1
      - name: Prepare Netlify MCP runtime
        run: npm install --prefix netlify-mcp-runtime @netlify/mcp@1.15.1 --no-audit --no-fund
      - name: Package Netlify MCP runtime
        uses: actions/upload-artifact@v4
        with:
          name: netlify-mcp-runtime
          path: netlify-mcp-runtime
          retention-days: 1
