name: Source Handoff
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source for deployment handoff
        uses: actions/upload-artifact@v4
        with:
          name: csai-source-handoff
          path: |
            .
            !.git/**
            !node_modules/**
          retention-days: 1
