name: Netlify Source Bundle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-source-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source bundle
        run: zip -qr netlify-source.zip . -x '.git/*' 'node_modules/*' 'netlify-source.zip' 'mcp-runner/*'
      - name: Prepare Netlify MCP runner
        run: |
          mkdir -p mcp-runner
          cd mcp-runner
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund @netlify/mcp@1.15.1
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-deploy-kit
          path: |
            netlify-source.zip
            mcp-runner
          if-no-files-found: error
          retention-days: 1
