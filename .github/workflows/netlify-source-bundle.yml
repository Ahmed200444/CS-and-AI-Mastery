name: Netlify Source Bundle
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/netlify-source-bundle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source bundle
        run: zip -qr netlify-source.zip . -x '.git/*' 'node_modules/*' 'netlify-source.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: netlify-source
          path: netlify-source.zip
          if-no-files-found: error
          retention-days: 1
