name: C++ browser smoke

on:
  push:
    branches:
      - fix/cpp-force-cxx-fast-path

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run exact Netlify build command
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const text=fs.readFileSync('netlify.toml','utf8');
          const match=text.match(/command = "([^"]+)"/);
          if(!match)throw new Error('Could not find Netlify build command');
          cp.execSync(match[1],{stdio:'inherit',shell:'/bin/bash'});
          NODE
      - name: Verify corrected C++ runner on every course and run every C++-enabled course
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/csai-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');

          (async()=>{
            const files=fs.readdirSync('courses').filter(f=>f.endsWith('.html')).sort();
            if(files.length!==54)throw new Error(`Expected 54 course pages, found ${files.length}`);

            // Static full-platform guard: every course page must load the same corrected controller,
            // and no page may retain one of the old cached controllers.
            const staticFailures=[];
            for(const file of files){
              const html=fs.readFileSync('courses/'+file,'utf8');
              const current=(html.match(/\/assets\/cpp-runner-ui-worker\.js\?v=20260809-4/g)||[]).length;
              if(current!==1)staticFailures.push(`${file}: corrected C++ runner v20260809-4 count=${current}`);
              if(/cpp-runner-ui-worker\.js\?v=20260809-[123]/.test(html))staticFailures.push(`${file}: stale C++ runner version remains`);
            }
            if(staticFailures.length)throw new Error('Full-platform C++ controller guard failed:\n'+staticFailures.join('\n'));
            console.log('Corrected C++ runner verified statically on all 54 course pages.');

            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext();
            const failures=[];
            const cppEnabled=[];

            for(const chosen of files){
              const page=await context.newPage();
              const courseId=chosen.replace(/\.html$/,'');
              page.on('console',m=>{
                const text=m.text();
                if(/\[C\+\+ runner\]|Emception|clang|wasm-ld/i.test(text))console.log(`[${courseId}] [browser] ${m.type()} ${text}`);
              });
              page.on('pageerror',e=>console.log(`[${courseId}] [pageerror] ${e.message}`));

              try{
                await page.addInitScript(({courseId})=>{
                  try{localStorage.setItem('csai-course-language-v2:'+courseId,'cpp');}catch(e){}
                },{courseId});

                await page.goto('http://127.0.0.1:4173/courses/'+encodeURIComponent(chosen),{waitUntil:'domcontentloaded',timeout:30000});
                const runnerVersion=await page.locator('script[src*="cpp-runner-ui-worker.js?v=20260809-4"]').count();
                if(runnerVersion!==1)throw new Error('corrected C++ runner is not present exactly once in browser DOM');

                // Give the language-enhancement scripts time to generate C++ variants where the course supports them.
                await page.waitForTimeout(1200);
                const hasCpp=await page.evaluate(()=>[...document.querySelectorAll('[data-lang-variant="cpp"]')].some(v=>v.querySelector('[data-run-language-example]')&&v.querySelector('[data-csai-example-output]')));
                if(!hasCpp){
                  console.log(`[${courseId}] no C++ lesson examples by design; controller presence verified.`);
                  continue;
                }

                cppEnabled.push(courseId);
                const result=await page.evaluate(async()=>{
                  const variants=[...document.querySelectorAll('[data-lang-variant="cpp"]')];
                  const runnable=variants.filter(v=>v.querySelector('[data-run-language-example]')&&v.querySelector('[data-csai-example-output]'));
                  const variant=runnable.find(v=>/iostream|cout|vector|string|int\s+main/.test(v.textContent||''))||runnable[0];
                  if(!variant)throw new Error('No runnable C++ example was generated');
                  const button=variant.querySelector('[data-run-language-example]');
                  const out=variant.querySelector('[data-csai-example-output]');
                  const code=(variant.querySelector('[data-csai-language-generated],.csai-language-code')?.textContent||'').trim();
                  if(!/#include|int\s+main|cout|vector/.test(code))throw new Error('Generated example does not look like real C++ source');
                  button.click();
                  const start=Date.now();
                  while(Date.now()-start<120000){
                    const text=String(out.textContent||'');
                    if(/Run error|Output/.test(text))return {text,ms:Date.now()-start};
                    await new Promise(r=>setTimeout(r,500));
                  }
                  return {text:String(out.textContent||''),ms:Date.now()-start,timeout:true};
                });

                console.log(`[${courseId}] C++ result after ${result.ms}ms: ${result.text.replace(/\s+/g,' ').slice(0,300)}`);
                if(result.timeout)throw new Error('C++ run timed out');
                if(/Run error/.test(result.text))throw new Error('C++ run failed: '+result.text);
                if(/invalid argument ['"]-std=c\+\+17['"] not allowed with ['"]C['"]/.test(result.text))throw new Error('C/C++ language-mode regression remains');
                if(!/Output/.test(result.text))throw new Error('C++ example did not produce a successful Output result');
              }catch(error){
                failures.push(`${chosen}: ${error&&error.message||error}`);
              }finally{
                await page.close();
              }
            }

            await browser.close();
            console.log(`Browser-executed C++ successfully on ${cppEnabled.length} C++-enabled course(s): ${cppEnabled.join(', ')}`);
            console.log(`Controller presence verified on all ${files.length} course pages.`);
            if(cppEnabled.length===0)failures.push('No C++-enabled course was found, so browser execution was never exercised');
            if(failures.length){
              console.error('C++ full-platform failures:\n'+failures.join('\n'));
              process.exit(1);
            }
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
