name: Integrate portfolio projects UI

on:
  push:
    branches:
      - feature/portfolio-projects
    paths:
      - assets/portfolio-projects.js
      - .github/workflows/integrate-portfolio-projects.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[skip portfolio integration]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/portfolio-projects
          fetch-depth: 0

      - name: Add project loader without changing saved GitHub settings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          if not path.exists():
              raise SystemExit('index.html was not found')

          html = path.read_text(encoding='utf-8')
          loader = '<script defer src="assets/portfolio-projects.js"></script>'

          if loader in html:
              print('Portfolio loader is already installed.')
              raise SystemExit(0)

          marker = '</body>'
          if marker not in html:
              raise SystemExit('Could not safely find </body>; no changes were made.')

          html = html.replace(marker, f'  {loader}\n{marker}', 1)
          path.write_text(html, encoding='utf-8')
          print('Portfolio loader inserted before </body>.')
          PY

      - name: Commit integration when needed
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate per-track portfolio projects UI [skip portfolio integration]"
          git push origin feature/portfolio-projects
