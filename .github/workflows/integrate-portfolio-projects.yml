name: Integrate portfolio projects UI

on:
  push:
    branches:
      - feature/portfolio-projects
    paths:
      - assets/portfolio-projects.js
      - .github/workflows/integrate-portfolio-projects.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[skip portfolio integration]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/portfolio-projects
          fetch-depth: 0

      - name: Install loader only before the final body tag
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          if not path.exists():
              raise SystemExit('index.html was not found')

          html = path.read_text(encoding='utf-8')
          loader = '<script defer src="assets/portfolio-projects.js"></script>'

          # Remove any prior loader placement, including one inside demo/srcdoc strings.
          html = html.replace('  ' + loader + '\n', '')
          html = html.replace(loader + '\n', '')
          html = html.replace(loader, '')

          marker = '</body>'
          position = html.rfind(marker)
          if position < 0:
              raise SystemExit('Could not safely find the final </body>; no changes were made.')

          html = html[:position] + '  ' + loader + '\n' + html[position:]
          path.write_text(html, encoding='utf-8')
          print('Portfolio loader installed before the final </body>.')
          PY

      - name: Commit integration when needed
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Correct portfolio projects loader placement [skip portfolio integration]"
          git push origin feature/portfolio-projects
