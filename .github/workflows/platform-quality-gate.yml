name: Platform quality gate

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: platform-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run repository tests
        run: npm test

      - name: Run exact production build
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const text = fs.readFileSync('netlify.toml', 'utf8');
          const match = text.match(/command = "([^"]+)"/);
          if (!match) throw new Error('Could not find Netlify build command');
          cp.execSync(match[1], {stdio: 'inherit', shell: '/bin/bash'});
          NODE

      - name: Verify generated platform coverage
        shell: bash
        run: |
          test "$(find courses -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 54
          test "$(grep -l '/assets/github-portfolio-controls.js' courses/*.html | wc -l)" -eq 54
          test "$(grep -l '/assets/smart-code-editor.js' courses/*.html | wc -l)" -eq 54
          test "$(grep -l '/assets/universal-safe-output.js' courses/*.html | wc -l)" -eq 54
          test "$(grep -l '/assets/evergreen-example-diversity.js' courses/*.html | wc -l)" -eq 54
          ! grep -Eiq 'CS[[:space:]]*&[[:space:]]*AI[[:space:]]*Mastery[[:space:]]+v[0-9]+\.[0-9]+\.[0-9]+' index.html
          echo 'All 54 generated courses contain the final quality layer.'

      - name: Install Chromium smoke-test runtime
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Browser-smoke all 54 courses
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/csai-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node scripts/browser-platform-smoke.cjs
