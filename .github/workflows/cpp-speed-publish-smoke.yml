name: C++ course and platform predeploy smoke

on:
  push:
    branches:
      - fix/cpp-background-warmup

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run exact Netlify build command
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const text=fs.readFileSync('netlify.toml','utf8');
          const match=text.match(/command = "([^"]+)"/);
          if(!match)throw new Error('Could not find Netlify build command');
          cp.execSync(match[1],{stdio:'inherit',shell:'/bin/bash'});
          NODE
      - name: Diagnose second C++ loop example warmup
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/csai-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node scripts/predeploy-cpp-loop-alt-debug.cjs
