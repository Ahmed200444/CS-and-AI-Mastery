name: Quality Gate
on:
  pull_request:
  push:
    branches: [upgrade/final-9-5-audit, audit/full-browser-certification, main]

jobs:
  full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run repository contracts
        run: npm test

      - name: Run the exact Netlify production build command
        run: |
          node <<'NODE'
          const fs=require('fs');const {execSync}=require('child_process');
          const toml=fs.readFileSync('netlify.toml','utf8');const match=toml.match(/^\s*command\s*=\s*"([^"]+)"/m);
          if(!match)throw new Error('Netlify build command not found');
          execSync(match[1],{stdio:'inherit',shell:'/bin/bash',env:process.env});
          NODE

      - name: Execute and compile every generated Python/C++ example
        run: npm run certify:code

      - name: Install Chromium for browser certification
        run: npx playwright install --with-deps chromium

      - name: Verify theme and sub-second static course interaction
        run: npm run certify:theme

      - name: Verify flexible Python routing regression
        run: node tests/flexible-routing-regression.mjs

      - name: Click-test the complete generated learning platform
        run: npm run certify:browser

      - name: Compile and execute every C++-enabled workspace
        run: npm run certify:cpp

      - name: Upload certification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-certification
          path: |
            browser-certification-report.json
            cpp-workspace-certification-report.json
            theme-certification-report.json
            routing-regression-report.json
          if-no-files-found: ignore

      - name: Verify live Netlify deployment
        if: github.ref == 'refs/heads/main'
        env:
          LIVE_SITE_URL: https://cs-ai-mastery.netlify.app
        run: npm run certify:live
