name: Example Depth Check
on:
  push:
    branches: [main]
    paths:
      - 'scripts/enrich-dsa-example-depth.cjs'
      - 'courses/**'
      - 'assets/**'
      - 'scripts/**'
      - 'netlify.toml'
      - '.github/workflows/example-depth-check.yml'
  pull_request:
    paths:
      - 'scripts/enrich-dsa-example-depth.cjs'
      - 'courses/**'
      - 'assets/**'
      - 'scripts/**'
      - 'netlify.toml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check example-depth script
        run: node --check scripts/enrich-dsa-example-depth.cjs
      - name: Production build phase 1 - prepare pages
        run: >-
          node --check scripts/sanitize-inline-script-closures.cjs &&
          node scripts/sanitize-inline-script-closures.cjs &&
          node scripts/check-index-inline-js.cjs source &&
          node scripts/inject-home-first-paint-guard.cjs &&
          node scripts/check-index-inline-js.cjs home-guard &&
          node scripts/fix-catalog-first-paint.cjs &&
          node scripts/fix-catalog-course-navigation.cjs &&
          node --check assets/catalog-recovery.js &&
          node scripts/inject-course-loader.cjs &&
          node scripts/check-index-inline-js.cjs course-loader &&
          node scripts/reorder-internship-catalog.cjs &&
          node scripts/embed-catalog-data.cjs &&
          node scripts/inject-course-theme-toggle.cjs &&
          node scripts/check-index-inline-js.cjs course-theme &&
          node scripts/generate-static-course-pages.cjs
      - name: Production build phase 2 - enrich and audit examples
        run: >-
          node scripts/enrich-dsa-example-depth.cjs &&
          node scripts/audit-static-lesson-examples.cjs &&
          node scripts/inject-lesson-example-runner.cjs
      - name: Verify DSA five-example floor
        run: |
          node <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('EXAMPLE_COVERAGE_QA_v5.75.json','utf8'));
          if(report.status!=='PASS') throw new Error('Coverage report did not pass');
          if(report.coursesAudited!==62) throw new Error(`Expected 62 courses, got ${report.coursesAudited}`);
          for(const [id,count] of Object.entries(report.dsaStaticFiveExampleFloor||{})) {
            if(count<5) throw new Error(`${id} has only ${count} static examples`);
          }
          console.log(`PASS: ${report.coursesAudited} courses / ${report.lessonsAudited} lessons audited; ${report.staticExamplesAdded} curated DSA examples added.`);
          NODE
      - name: Production build phase 3 - learning and assessment layers
        run: >-
          node scripts/remove-evergreen-predict-output.cjs &&
          node --check assets/evergreen-learning-engine.js &&
          node scripts/inject-evergreen-learning-engine.cjs &&
          node --check assets/evergreen-review-navigation.js &&
          node scripts/inject-evergreen-review-navigation.cjs &&
          node --check assets/smart-evergreen-review.js &&
          node scripts/inject-smart-evergreen-review.cjs &&
          node scripts/disable-assessment-python-prewarm.cjs &&
          node --check assets/assessment-practice.js &&
          node scripts/inject-assessment-practice.cjs &&
          node scripts/inject-assessment-layout-fix.cjs &&
          node scripts/inject-universal-reveal-solutions.cjs &&
          node scripts/inject-reveal-solution-explanations.cjs &&
          node scripts/inject-assessment-expanded-descriptions.cjs &&
          node --check assets/exercise-direct-publish.js &&
          node scripts/inject-exercise-direct-publish.cjs &&
          node scripts/inject-universal-run-output.cjs &&
          node --check assets/final-exercise-toolbar.js &&
          node scripts/inject-final-exercise-toolbar.cjs
      - name: Production build phase 4 - project and design layers
        run: >-
          node scripts/repair-course-project-workspace.cjs &&
          node --check assets/course-project-workspace.js &&
          node scripts/inject-course-project-workspace.cjs &&
          node scripts/inject-catalog-filter-controls.cjs &&
          node scripts/check-index-inline-js.cjs catalog-filters &&
          node --check assets/example-learning-tools.js &&
          node --check assets/practice-publish-completer.js &&
          node scripts/inject-example-practice-tools.cjs &&
          node scripts/inject-course-first-paint-guard.cjs &&
          node scripts/remove-visible-home-version.cjs &&
          node scripts/inject-final-quality-layer.cjs &&
          node scripts/check-index-inline-js.cjs final-quality &&
          node --check assets/unified-learning-design.js &&
          node --check assets/product-redesign-v2.js &&
          node --check assets/adaptive-v4-live.js &&
          node --check assets/hero-polish.js &&
          node scripts/inject-unified-learning-design.cjs &&
          node scripts/check-index-inline-js.cjs unified-design &&
          node --check assets/adaptive-practice-layer.js &&
          node --check assets/project-readme-layer.js &&
          node scripts/verify-smart-project-readmes.cjs &&
          node --check assets/home-path-polish.js &&
          node --check assets/python-only-ui.js
      - name: Production build phase 5 - production augmentation and study examples
        run: >-
          node scripts/prepare-production-augmentation.cjs &&
          node scripts/augment-production-platform.cjs &&
          node scripts/restore-production-coursedata.cjs &&
          node scripts/restore-valid-coursedata.cjs &&
          node scripts/check-index-inline-js.cjs augmentation &&
          node --check assets/runner-performance-guard.js &&
          node scripts/inject-runner-performance-guard.cjs &&
          node scripts/ensure-all-course-assessments.cjs &&
          node --check assets/oa-assessment-fallback.js &&
          node --check assets/oa-assessment-upgrade.js &&
          node scripts/inject-oa-assessment-upgrade.cjs &&
          node scripts/enforce-python-only-platform.cjs &&
          node scripts/fix-python-only-runtime-injection.cjs &&
          node scripts/check-index-inline-js.cjs python-only &&
          node --check assets/study-examples.js &&
          node --check assets/portfolio-publish-controls.js &&
          node scripts/inject-study-examples.cjs &&
          node scripts/verify-study-examples.cjs &&
          node scripts/build-learning-quality-report.cjs
      - name: Production build phase 6 - final verification
        run: >-
          node scripts/verify-final-quality-layer.cjs &&
          node scripts/inject-first-paint-runtime.cjs &&
          node scripts/verify-unified-learning-design.cjs &&
          node scripts/verify-python-only-platform.cjs &&
          node scripts/verify-production-augmentation.cjs &&
          node scripts/verify-runner-performance.cjs &&
          node scripts/verify-oa-assessment-upgrade.cjs &&
          node scripts/audit-production-integrity.cjs &&
          node scripts/inject-try-it-yourself-homepage.cjs &&
          node scripts/apply-performance-release.cjs &&
          node scripts/reexport-course-data-mirrors.cjs
      - name: Production build phase 7 - repository contracts
        run: npm test
