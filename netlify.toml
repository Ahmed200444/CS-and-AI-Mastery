# --- Runtime engine proxies ---------------------------------------------------
# The platform loads its language engines from /runtime/pyodide/, /runtime/sql/ and
# /runtime/cpp/, but no runtime/ directory is published, so on a fresh deploy the
# Python and SQL runners had nothing to load and no fallback.
#
# These are PROXY redirects (status = 200), not 301/302: the browser keeps the
# same-origin /runtime/... URL while Netlify fetches the pinned upstream. That also
# keeps them compatible with the Cross-Origin-Embedder-Policy: require-corp header
# declared in [[headers]] below, which would otherwise block cross-origin fetches.
#
# Versions are pinned exactly. `force` is deliberately NOT set: if a real runtime/
# folder is ever restored into the publish directory, the local file takes
# precedence and these proxies become a no-op.

[[redirects]]
  from = "/runtime/pyodide/*"
  to = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/:splat"
  status = 200

[[redirects]]
  from = "/runtime/sql/*"
  to = "https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/:splat"
  status = 200

# JSCPP 2.0.9 -- the npm package for 2.0.9 ships no browser ES5 bundle (only CommonJS
# lib/*), and the upstream repo has no git tags, so the ES5 bundle is pinned to the
# exact gh-pages commit that publishes dist/JSCPP.es5.min.js.
[[redirects]]
  from = "/runtime/cpp/*"
  to = "https://cdn.jsdelivr.net/gh/felixhao28/JSCPP@76e3534f04abf9c2547aa73ddca275e8935bed38/dist/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
