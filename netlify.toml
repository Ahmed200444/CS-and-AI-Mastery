[build]
  command = "node scripts/inject-course-loader.cjs && node scripts/reorder-internship-catalog.cjs && node scripts/embed-catalog-data.cjs && node scripts/inject-course-theme-toggle.cjs && node scripts/generate-static-course-pages.cjs && node scripts/expand-static-lesson-content.cjs && node scripts/audit-static-lesson-examples.cjs && node scripts/inject-lesson-example-runner.cjs && node --check assets/evergreen-learning-engine.js && node scripts/inject-evergreen-learning-engine.cjs && node --check assets/evergreen-review-navigation.js && node scripts/inject-evergreen-review-navigation.cjs && node --check assets/smart-evergreen-review.js && node scripts/inject-smart-evergreen-review.cjs && node scripts/disable-assessment-python-prewarm.cjs && node --check assets/assessment-practice.js && node scripts/inject-assessment-practice.cjs && node scripts/inject-assessment-layout-fix.cjs && node scripts/inject-universal-reveal-solutions.cjs && node scripts/inject-reveal-solution-explanations.cjs && node scripts/inject-assessment-expanded-descriptions.cjs && node --check assets/exercise-direct-publish.js && node scripts/inject-exercise-direct-publish.cjs && node scripts/inject-universal-run-output.cjs && node --check assets/final-exercise-toolbar.js && node scripts/inject-final-exercise-toolbar.cjs && node scripts/repair-course-project-workspace.cjs && node --check assets/course-project-workspace.js && node scripts/inject-course-project-workspace.cjs && node scripts/inject-catalog-filter-controls.cjs && node --check assets/primary-language-mode.js && node scripts/inject-primary-language-mode.cjs && node scripts/build-learning-quality-report.cjs && node scripts/verify-final-platform-upgrades.cjs"
  publish = "."
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . ':(exclude)student-code/**'"

[[redirects]]
  from = "/api/github/authorize"
  to = "/.netlify/functions/github-authorize"
  status = 200
[[redirects]]
  from = "/api/github/callback"
  to = "/.netlify/functions/github-callback"
  status = 200
[[redirects]]
  from = "/api/github/status"
  to = "/.netlify/functions/github-status"
  status = 200
[[redirects]]
  from = "/api/github/sync"
  to = "/.netlify/functions/github-sync"
  status = 200
[[redirects]]
  from = "/api/github/file"
  to = "/.netlify/functions/github-file"
  status = 200
[[redirects]]
  from = "/api/github/disconnect"
  to = "/.netlify/functions/github-disconnect"
  status = 200
