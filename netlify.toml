[build]
  command = "node scripts/inject-course-loader.cjs && node scripts/reorder-internship-catalog.cjs && node scripts/embed-catalog-data.cjs && node scripts/inject-course-theme-toggle.cjs && node scripts/generate-static-course-pages.cjs"
  publish = "."
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF . ':(exclude)student-code/**'"

[[redirects]]
  from = "/api/github/authorize"
  to = "/.netlify/functions/github-authorize"
  status = 200
[[redirects]]
  from = "/api/github/callback"
  to = "/.netlify/functions/github-callback"
  status = 200
[[redirects]]
  from = "/api/github/status"
  to = "/.netlify/functions/github-status"
  status = 200
[[redirects]]
  from = "/api/github/sync"
  to = "/.netlify/functions/github-sync"
  status = 200
[[redirects]]
  from = "/api/github/file"
  to = "/.netlify/functions/github-file"
  status = 200
[[redirects]]
  from = "/api/github/disconnect"
  to = "/.netlify/functions/github-disconnect"
  status = 200
